name: DEV｜手动构建部署测试环境
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 dev 分支代码
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包
        run: pnpm run build

      - name: 上传dist制品
        uses: actions/upload-artifact@v4
        with:
          name: dev-dist
          path: dist
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载dist
        uses: actions/download-artifact@v4
        with:
          name: dev-dist
          path: dist

      # 加载私钥
      - name: 启用SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      # 部署：rsync上传，参数和你原来ARGS保持一致
      - name: Rsync部署到DEV测试ECS
        env:
          REMOTE_HOST: ${{ secrets.DEV_ECS_HOST }}
          REMOTE_USER: ${{ secrets.DEV_ECS_USER }}
          TARGET: "/etc/nginx/sites-enabled/vue-project.conf"
        run: |
          ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts
          # 参数 -rltgoDzvO --delete 和你之前 ARGS 完全一样
          rsync -rltgoDzvO --delete dist/ $REMOTE_USER@$REMOTE_HOST:$TARGET
          # 可选：执行权限修复
          ssh $REMOTE_USER@$REMOTE_HOST "chmod -R 755 $TARGET"
