name: DEV｜手动构建部署测试环境
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 dev 分支代码
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包
        run: pnpm run build

      - name: 上传dist制品
        uses: actions/upload-artifact@v4
        with:
          name: dev-dist
          path: dist
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载dist
        uses: actions/download-artifact@v4
        with:
          name: dev-dist
          path: dist

      - name: 部署到DEV测试ECS
        uses: easingthemes/ssh-deploy@v2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.DEV_ECS_HOST }}
          REMOTE_USER: ${{ secrets.DEV_ECS_USER }}
          TARGET: "/usr/share/nginx/html" # 测试机静态目录
