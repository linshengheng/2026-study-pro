name: CI 自动打包流水线
on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 和.gitpod.yml保持一致，启用corepack管理pnpm版本
      - name: 启用corepack
        run: npm install -g corepack && corepack enable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 👉 这里后续确认你的打包脚本，先写pnpm build，不对再改
      - name: 打包构建
        run: pnpm build

      - name: 上传dist产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist