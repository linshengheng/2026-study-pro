name: PRO｜手动构建部署生产环境
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main 分支代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包
        run: pnpm run build

      - name: 上传dist制品
        uses: actions/upload-artifact@v4
        with:
          name: pro-dist
          path: dist
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载dist
        uses: actions/download-artifact@v4
        with:
          name: pro-dist
          path: dist

      # 加载生产环境私钥
      - name: 启用SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRO_SSH_PRIVATE_KEY }}

      # Rsync部署，rsync参数和你原来ARGS保持一致
      - name: Rsync部署到PRO生产ECS
        env:
          REMOTE_HOST: ${{ secrets.PRO_ECS_HOST }}
          REMOTE_USER: ${{ secrets.PRO_ECS_USER }}
          TARGET: "/usr/share/nginx/html"
        run: |
          ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts
          # 原参数 -rltgoDzvO --delete，和旧ssh-deploy行为保持一致
          rsync -rltgoDzvO --delete dist/ $REMOTE_USER@$REMOTE_HOST:$TARGET
          ssh $REMOTE_USER@$REMOTE_HOST "chmod -R 755 $TARGET"
